name: Release PunishNotify

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/PunishNotify-*.jar
          generate_release_notes: true

      - name: Publish to Modrinth
        uses: Kirbell/modrinth-action@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: punishnotify
          version_number: ${{ github.ref_name }}
          name: "PunishNotify ${{ github.ref_name }}"
          file: build/libs/PunishNotify-*.jar
          game_versions: '1.21, 1.21.1, 1.21.2, 1.21.3, 1.21.4, 1.21.11'
          loaders: 'paper, spigot, purpur, folia'
