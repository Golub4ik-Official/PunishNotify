# PunishNotify - Русская локаль
# Все пользовательские строки определены здесь.
# Вы можете скопировать этот файл и перевести его, чтобы создать собственный языковой пакет.

# -----------------------------------------------------------------------
# Названия типов наказаний (используются в Discord embed и сообщениях игрокам)
# -----------------------------------------------------------------------
punishment:
  ban: "Бан"
  unban: "Разбан"
  mute: "Мут"
  unmute: "Размут"
  kick: "Кик"
  warn: "Предупреждение"
  jail: "Тюрьма"
  unjail: "Освобождение"

# -----------------------------------------------------------------------
# Метки Discord embed
# -----------------------------------------------------------------------
embed:
  server_prefix: "Сервер "
  account_suffix: " аккаунта"
  field_player: "👤 Игрок"
  field_moderator: "🛡 Модератор"
  field_duration: "⏳ Срок"
  field_reason: "📝 Причина"
  permanent: "Навсегда"
  no_reason: "Не указана"
  console: "Консоль"
  footer: "PunishNotify System"

# -----------------------------------------------------------------------
# Сообщения игрокам (отправляются модератору в игре)
# -----------------------------------------------------------------------
notify:
  header: "[PunishNotify] "
  punishment_line: "%s: "        # %s = эмодзи + название типа
  player_line: "%s"              # %s = имя игрока
  attach_question: "Прикрепить доказательства?"
  upload_button: " [Загрузить] "
  upload_hover: "Открыть страницу загрузки"
  skip_button: " [Пропустить] "
  skip_hover: "Отправить без доказательств"

# -----------------------------------------------------------------------
# Сообщения команды /punishnotify
# -----------------------------------------------------------------------
command:
  no_permission: "У вас нет прав на эту команду."
  unknown_subcommand: "Неизвестная подкоманда. Используйте /punishnotify reload"
  reload_success: "[PunishNotify] Конфигурация перезагружена."
  skip_usage: "Использование: /punishnotify skip <token>"
  token_not_found: "[PunishNotify] Токен не найден или уже обработан."
  skip_success: "[PunishNotify] Вебхук отправлен без доказательств."

# -----------------------------------------------------------------------
# Сообщения в логах сервера (видимы в консоли сервера)
# -----------------------------------------------------------------------
log:
  enabled: "PunishNotify v%s включён."
  disabled: "PunishNotify выключен."
  listeners_registered: "Слушатель команд наказаний зарегистрирован."
  essentials_not_found: "EssentialsX не найден. События наказаний не будут отслеживаться."
  essentials_api_error: "EssentialsX API не совместим: %s"
  essentials_registered: "Слушатель событий EssentialsX зарегистрирован."
  upload_page_not_found: "Страница загрузки (web/upload.html) не найдена в ресурсах."
  upload_page_error: "Ошибка загрузки страницы: %s"
  http_server_started: "HTTP-сервер загрузки запущен на %s:%s"
  http_server_stopped: "HTTP-сервер загрузки остановлен."
  http_server_start_failed: "Не удалось запустить HTTP-сервер: %s"
  http_error_get: "HTTP ошибка (GET /): %s"
  http_error_upload: "HTTP ошибка (POST /upload): %s"
  http_error_skip: "HTTP ошибка (POST /skip): %s"
  multipart_invalid: "Неверный формат multipart: нет начальной границы"
  file_limit_exceeded: "Превышен лимит файлов: %s"
  webhook_sent: "Вебхук отправлен для %s (%s), HTTP %s"
  webhook_rejected: "Вебхук для %s (%s) отклонён Discord: HTTP %s - %s"
  webhook_send_error: "Ошибка отправки вебхука: %s"
  webhook_prepare_error: "Ошибка подготовки вебхука: %s"
  timeout_queued: "Таймаут доказательств для %s (%s) — вебхук поставлен в очередь без файлов."
  console_punishment: "Наказание от консоли для %s — вебхук поставлен в очередь без доказательств."
  moderator_offline: "Модератор оффлайн для %s — вебхук поставлен в очередь без доказательств."
  token_not_found: "Токен %s не найден или уже обработан."
  evidence_queued: "Вебхук для %s (%s) отправляется с %s файлами."
  skip_queued: "Вебхук для %s (%s) отправляется без доказательств."
  queue_started: "Очередь повторных вебхуков запущена."
  queue_stopped: "Очередь повторных вебхуков остановлена."
  queue_attempt: "Попытка %s/%s для %s (%s)..."
  queue_success: "Вебхук доставлен с повторной попытки для %s (%s)."
  queue_failed: "Вебхук окончательно не доставлен после %s попыток для %s (%s)."
  locale_loaded: "Локаль '%s' загружена."
  locale_not_found: "Локаль '%s' не найдена, используется 'en'."
  locale_fallback_failed: "Не удалось загрузить запасную локаль 'en'. Используется пустая локаль."

# -----------------------------------------------------------------------
# Строки веб-страницы загрузки (плейсхолдеры {{i18n.KEY}} в upload.html)
# -----------------------------------------------------------------------
web:
  title: "PunishNotify — Загрузка доказательств"
  subtitle: "Загрузка доказательств наказания"
  drop_hint: "Нажмите или перетащите файлы"
  drop_limit: "До %s файлов, макс. %s МБ каждый"
  skip_btn: "Пропустить"
  upload_btn: "Загрузить"
  uploading: "Загрузка..."
  processing: "Обработка..."
  success_title: "Доказательства загружены"
  success_subtitle: "Файлов отправлено: %s. Можете закрыть страницу."
  error_prefix: "Ошибка: "
  error_network: "Ошибка сети: "
  error_format: "Формат не поддерживается"
  error_too_large: "Файл превышает %s МБ"
  error_limit: "Достигнут лимит в %s файлов"
  skip_loading: "Отмена..."
  skip_success_title: "Наказание отправлено без доказательств"
  skip_success_subtitle: "Можете закрыть страницу."
  remove_title: "Удалить"
