discord:
  webhook-url: ""
  username: "PunishNotify"
  avatar-url: ""
  # Retry queue when Discord is unavailable / Очередь с повторными попытками при недоступности Discord
  retry-enabled: true
  retry-max-attempts: 5
  retry-interval-seconds: 30

http-server:
  enabled: true
  port: 8734
  bind: "0.0.0.0"
  # Public address for the evidence upload link (visible to players/moderators).
  # If empty — "http://<bind>:<port>" is used. Example: "http://server.example.com"
  # Публичный адрес для ссылки загрузки доказательств (виден игрокам/модераторам).
  # Если пусто — используется "http://<bind>:<port>". Пример: "http://server.kibermine.ru"
  public-url: ""

evidence:
  max-file-size-mb: 25
  max-files: 10
  timeout-seconds: 120

events:
  ban: true
  unban: true
  mute: true
  unmute: true
  kick: true
  warn: true
  jail: true
  unjail: true

# Plugin language / Язык плагина.
# Built-in languages / Встроенные языки: en (English), ru (Русский)
# You can create a custom language file in plugins/PunishNotify/lang/<code>.yml
# (copy en.yml or ru.yml as a base) and set its code below.
# Вы можете создать свой файл локализации в plugins/PunishNotify/lang/<код>.yml
# (за основу возьмите en.yml или ru.yml) и указать его код ниже.
language: "en"
