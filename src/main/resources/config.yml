discord:
  webhook-url: ""
  username: "PunishNotify"
  avatar-url: ""
  # Очередь с повторными попытками при недоступности Discord
  retry-enabled: true
  retry-max-attempts: 5
  retry-interval-seconds: 30

http-server:
  enabled: true
  port: 8734
  bind: "0.0.0.0"
  # Публичный адрес для ссылки загрузки доказательств (виден игрокам/модераторам).
  # Если пусто — используется "http://<bind>:<port>". Пример: "http://server.kibermine.ru"
  public-url: ""

evidence:
  max-file-size-mb: 25
  max-files: 10
  timeout-seconds: 120

events:
  ban: true
  unban: true
  mute: true
  unmute: true
  kick: true
  warn: true
  jail: true
  unjail: true
